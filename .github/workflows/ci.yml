name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:test :core:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests
            core/build/reports/tests
          if-no-files-found: ignore

  instrumented-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # KVM is required for a reasonably fast emulator on GitHub-hosted runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            ./gradlew :app:assembleRelease --stacktrace

            # There's no real signing key in CI (keystore.properties is gitignored), so the release
            # build type falls back to debug signing - see app/build.gradle. That's enough to
            # actually install and launch the minified build, which is what catches R8 stripping
            # something a build-time-only check (just running assembleRelease) can't: the app has
            # shipped a release build that crashed immediately on launch before (Room's _Impl
            # classes got stripped) while assembleRelease itself succeeded.
            PKG=org.happypeng.sumatora.android.sumatoradictionary
            adb uninstall "$PKG" || true
            adb install -r app/build/outputs/apk/release/*.apk
            adb logcat -c
            adb shell am start -W -n "$PKG/.activity.MainActivity"

            resumed=0
            for i in $(seq 1 30); do
              adb logcat -d > release-launch-logcat.txt
              if grep -q "FATAL EXCEPTION" release-launch-logcat.txt; then
                echo "Release build crashed on launch:"
                cat release-launch-logcat.txt
                exit 1
              fi
              if adb shell dumpsys activity activities | grep -qE "(m|top)ResumedActivity.*MainActivity"; then
                resumed=1
                break
              fi
              sleep 2
            done
            adb logcat -d > release-launch-logcat.txt

            if [ "$resumed" != "1" ]; then
              echo "Release build's MainActivity never became resumed within the timeout:"
              cat release-launch-logcat.txt
              exit 1
            fi
            echo "Release build (minified, debug-signed) launched MainActivity successfully."

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore

      - name: Upload release launch logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-launch-logcat
          path: release-launch-logcat.txt
          if-no-files-found: ignore
