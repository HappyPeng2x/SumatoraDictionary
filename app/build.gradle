apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-parcelize'
apply plugin: 'dagger.hilt.android.plugin'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "org.happypeng.sumatora.android.sumatoradictionary"

    compileSdkVersion 35

    defaultConfig {
        applicationId "org.happypeng.sumatora.android.sumatoradictionary"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 38
        versionName "0.5.0-beta1"
        multiDexEnabled true

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }

        kotlinOptions {
            jvmTarget = '1.8'
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation":"$projectDir/schemas".toString()]
            }
        }

        testInstrumentationRunner "org.happypeng.sumatora.android.sumatoradictionary.CustomTestRunner"
        testInstrumentationRunnerArguments disableAnalytics: 'true'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            buildConfigField("boolean", "DEBUG_MESSAGE", "false")
            buildConfigField("boolean", "DEBUG_QUERYTOOL", "false")
            buildConfigField("boolean", "DEBUG_DICTIONARY_ACTIVITY", "false")
            buildConfigField("boolean", "DEBUG_LAUNCH_ACTIVITY", "false")
            buildConfigField("boolean", "DEBUG_DB_MIGRATION", "false")
            buildConfigField("boolean", "DEBUG_BASE_FRAGMENT", "false")
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            buildConfigField("boolean", "DEBUG_MESSAGE", "true")
            buildConfigField("boolean", "DEBUG_QUERYTOOL", "true")
            buildConfigField("boolean", "DEBUG_DICTIONARY_ACTIVITY", "true")
            buildConfigField("boolean", "DEBUG_LAUNCH_ACTIVITY", "true")
            buildConfigField("boolean", "DEBUG_DB_MIGRATION", "true")
            buildConfigField("boolean", "DEBUG_BASE_FRAGMENT", "true")
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Exposes the exported Room schema JSONs (app/schemas, written by room.schemaLocation above)
    // as androidTest assets so MigrationTestHelper can build a real historical database to
    // migrate from - see PersistentDatabaseMigrationTest.
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "SumatoraDictionary-${variant.mergedFlavor.versionName}.apk"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':core')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.work:work-testing:2.9.0'

    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.daniel-stoneuk:material-about-library:3.1.2'

    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.2.0"

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.room:room-rxjava3:$room_version"
    androidTestImplementation "androidx.room:room-testing:$room_version"

    implementation "androidx.paging:paging-runtime:2.1.2"
    implementation "androidx.paging:paging-common:2.1.2"

    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation "com.github.tony19:logback-android:2.0.0"
    implementation 'com.github.requery:sqlite-android:3.49.0'
    implementation 'com.github.HappyPeng2x:SuperRubySpan:v0.2.1'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-android-compiler:2.51.1'
    annotationProcessor 'com.google.dagger:hilt-android-compiler:2.51.1'

    // Hilt Testing
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.51.1'
    kaptAndroidTest 'com.google.dagger:hilt-android-compiler:2.51.1'
    androidTestAnnotationProcessor 'com.google.dagger:hilt-android-compiler:2.51.1'

    implementation 'androidx.hilt:hilt-navigation-fragment:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    // Background dictionary update checks (see update-pipeline.md)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.hilt:hilt-work:1.2.0'

    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.0.4'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.core:core-ktx:1.3.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.2.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.fragment:fragment-ktx:1.3.0-beta01'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://jcenter.bintray.com' }
}
